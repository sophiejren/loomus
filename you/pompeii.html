<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Pompeii · LOOMUS</title>

<!-- LOOMUS auth (shared) -->
<script src="/loomus-auth.js" defer></script>
<!-- Margin client (for re-edit + delete reuse) -->

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,300;9..144,0,400;9..144,0,500;9..144,0,600;9..144,1,300;9..144,1,400;9..144,1,500&family=Geist+Mono:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#f5efe4; --paper-soft:#faf7f1; --cream-card:#faf6ec;
    --ink:#1f1d18; --ink-soft:#2a2620;
    --mute-1:rgba(31,29,24,0.72); --mute-2:rgba(31,29,24,0.55); --mute-3:rgba(31,29,24,0.32);
    --rule:#d4caba; --hairline:rgba(31,29,24,0.10);
    --ochre:#c19a3e; --ochre-bright:#d4ac4a; --ochre-deep:#8a6c21;
    --forest:#2d4a3e; --terracotta:#c66b3d; --burgundy:#7a2e3a;
    /* Pompeian red · the fresco "Fourth-Style" red that survived the ash —
       used sparingly, only on Pompeii-specific surfaces. */
    --pompeii-red:#a23a26;
    --pompeii-red-deep:#7e2a1a;
    --pompeii-red-soft:rgba(162,58,38,0.10);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body {
    background:var(--paper); color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    min-height:100vh; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ─── Fresco edge · the thin painted band at the top of every Pompeian wall ─── */
  body::before {
    content:''; position:fixed; left:0; right:0; top:0; height:3px;
    background:linear-gradient(90deg,
      var(--ochre) 0%, var(--ochre-bright) 30%,
      var(--pompeii-red) 65%, var(--pompeii-red-deep) 100%);
    z-index:9998; pointer-events:none;
  }

  /* ─── Chrome tab nav (WALL · MAP) ─── */
  .chrome {
    position:sticky; top:0; z-index:20;
    background:rgba(245,239,228,0.92);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hairline);
    padding:14px 24px; padding-top:calc(env(safe-area-inset-top, 0px) + 14px);
    display:flex; align-items:center; gap:18px;
  }
  .chrome .brand {
    font-family:'Geist Mono',monospace; font-weight:700;
    font-size:11px; letter-spacing:0.26em; text-transform:uppercase;
    color:var(--ink); text-decoration:none;
  }
  .chrome .brand .dot { color:var(--ochre); }
  .chrome .tabs {
    display:inline-flex; gap:2px; margin-left:auto;
    background:rgba(31,29,24,0.04); padding:3px;
    border-radius:99px;
  }
  .chrome .tabs a {
    padding:8px 14px; border-radius:99px;
    font-family:'Geist Mono',monospace; font-weight:600;
    font-size:10px; letter-spacing:0.20em; text-transform:uppercase;
    color:var(--mute-2); text-decoration:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    min-height:36px; display:inline-flex; align-items:center;
  }
  .chrome .tabs a.active {
    background:var(--ink); color:var(--paper);
  }
  .chrome .tabs a:not(.active):hover { color:var(--ink); }
  /* The "Pompeii" tab when active gets a tiny red underline below the pill
     — like a painter's signature. Subtle: nobody notices but everybody feels it. */
  .chrome .tabs a[href$="/pompeii"].active::after {
    content:''; position:absolute; left:50%; bottom:-7px;
    width:18px; height:2px; border-radius:99px;
    background:var(--pompeii-red); transform:translateX(-50%);
  }
  .chrome .tabs a { position:relative; }

  /* ─── Wall body container ─── */
  .wall-shell { max-width:1280px; margin:0 auto; padding:48px 32px 96px; }
  @media (max-width:760px) { .wall-shell { padding:28px 20px 80px; } }

  /* ─── Identity line ─── */
  .id-block {
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:24px; flex-wrap:wrap;
    margin-bottom:36px;
    padding-bottom:24px;
    border-bottom:1px solid var(--hairline);
  }
  .id-block h1 {
    font-family:'Fraunces',Georgia,serif; font-style:italic; font-weight:500;
    font-size:46px; line-height:1.06; letter-spacing:-0.018em;
    color:var(--ink);
    margin-bottom:10px;
  }
  .id-block h1 em {
    color:var(--pompeii-red); font-style:italic;
  }
  /* Roman-numeral annotation hovering above the count — small, dignified, optional */
  .id-block h1 .roman {
    display:inline-block;
    font-family:'Fraunces',Georgia,serif; font-style:normal; font-weight:500;
    font-size:13px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--pompeii-red); opacity:0.65;
    vertical-align:8px; margin-left:6px;
  }
  .id-block .sub {
    font-family:'Geist Mono',monospace; font-weight:500;
    font-size:11px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--mute-2);
  }
  .id-block .sub em {
    font-family:'Fraunces',serif; font-style:italic; font-weight:500;
    color:var(--ochre); letter-spacing:-0.005em; font-size:13px; text-transform:none;
  }
  .id-block .actions {
    display:flex; gap:10px; align-items:center;
  }
  .share-wall-btn {
    display:inline-flex; align-items:center; gap:8px;
    background:var(--pompeii-red); color:var(--paper-soft);
    border:none; padding:11px 18px 11px 14px;
    border-radius:99px; cursor:pointer;
    font-family:'Geist Mono',monospace; font-weight:600;
    font-size:10.5px; letter-spacing:0.22em; text-transform:uppercase;
    box-shadow:0 6px 18px -4px rgba(162,58,38,0.42);
    min-height:42px;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  .share-wall-btn:hover { background:var(--pompeii-red-deep); }

  /* ─── Filter pills ─── */
  .filters {
    display:inline-flex; gap:8px; flex-wrap:wrap;
    margin-bottom:28px;
  }
  .filters button {
    background:transparent; border:1px solid var(--rule);
    padding:9px 16px; border-radius:99px; cursor:pointer;
    font-family:'Geist Mono',monospace; font-weight:600;
    font-size:10px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--mute-2);
    min-height:38px;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  .filters button.active {
    background:var(--ink); color:var(--paper); border-color:var(--ink);
  }

  /* ─── Card grid ─── */
  .grid {
    display:grid; grid-template-columns:repeat(2, 1fr); gap:22px;
  }
  @media (max-width:860px) { .grid { grid-template-columns:1fr; } }

  .margin-card {
    background:#fff;
    border:1px solid var(--rule);
    border-radius:8px;
    padding:24px 24px 18px;
    display:flex; flex-direction:column;
    position:relative;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .margin-card:hover {
    transform:translateY(-2px);
    box-shadow:0 16px 36px -16px rgba(74,50,32,0.18);
  }
  .margin-card.just-added {
    animation:lm-flash 1.6s cubic-bezier(.32,.72,0,1) both;
    box-shadow:0 0 0 2px var(--pompeii-red), 0 18px 38px -16px rgba(162,58,38,0.36);
  }
  @keyframes lm-flash {
    0%   { transform:translateY(8px) scale(0.96); opacity:0.4; box-shadow:0 0 0 4px var(--pompeii-red); }
    100% { transform:translateY(0) scale(1); opacity:1; }
  }
  /* A tiny painted-corner detail on each margin card — like a fresco fragment.
     Top-left 12px square in Pompeian red, very subtle. */
  .margin-card::before {
    content:''; position:absolute; top:0; left:0;
    width:8px; height:8px;
    background:var(--pompeii-red);
    border-radius:0 0 4px 0;
    opacity:0.55;
  }

  .margin-card .source {
    display:flex; align-items:baseline; justify-content:space-between;
    gap:12px; margin-bottom:14px;
    padding-bottom:12px; border-bottom:1px dashed var(--rule);
  }
  .margin-card .source .book {
    font-family:'Geist Mono',monospace; font-weight:600;
    font-size:9.5px; letter-spacing:0.20em; text-transform:uppercase;
    color:var(--mute-2);
    flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .margin-card .source .book em {
    font-family:'Fraunces',serif; font-style:italic; font-weight:500;
    color:var(--ochre); letter-spacing:-0.005em; font-size:12px; text-transform:none;
  }
  .margin-card .source .vis {
    font-family:'Geist Mono',monospace; font-weight:600;
    font-size:9.5px; letter-spacing:0.22em; text-transform:uppercase;
    flex-shrink:0;
  }
  /* Public = Pompeian red ("on the wall, with everyone").
     Private = quiet grey. The contrast IS the meaning. */
  .margin-card .source .vis.public  { color:var(--pompeii-red); }
  .margin-card .source .vis.private { color:var(--mute-2); }

  .margin-card .quote {
    font-family:'Fraunces',serif; font-style:italic; font-weight:400;
    font-size:21px; line-height:1.35; letter-spacing:-0.005em;
    color:var(--ochre); margin-bottom:14px;
    border-left:2px solid var(--ochre); padding-left:14px;
  }
  .margin-card .take {
    font-family:'Newsreader',serif; font-style:italic;
    font-size:15px; line-height:1.55; color:var(--ink-soft);
    padding-left:16px; margin-bottom:16px;
  }
  .margin-card .meta {
    margin-top:auto;
    font-family:'Geist Mono',monospace; font-weight:500;
    font-size:9px; letter-spacing:0.20em; text-transform:uppercase;
    color:var(--mute-2);
    display:flex; gap:14px; align-items:baseline;
    padding-top:14px;
    border-top:1px solid var(--hairline);
  }
  .margin-card .meta .heard {
    color:var(--ochre); margin-left:auto;
  }

  /* Card action menu (… button + dropdown) */
  .card-menu-btn {
    position:absolute; top:14px; right:14px;
    background:transparent; border:none; cursor:pointer;
    padding:8px 12px;
    font-size:18px; line-height:1; color:var(--mute-2);
    border-radius:99px;
    -webkit-tap-highlight-color:transparent;
    min-height:36px; min-width:36px;
  }
  .card-menu-btn:hover { color:var(--ink); background:rgba(31,29,24,0.04); }
  .card-menu {
    position:absolute; top:46px; right:14px;
    background:#fff; border:1px solid var(--rule);
    border-radius:8px;
    box-shadow:0 14px 38px -10px rgba(74,50,32,0.28);
    min-width:200px; z-index:5;
    padding:6px;
    display:none;
  }
  .card-menu[data-open="true"] { display:block; }
  .card-menu button {
    display:flex; align-items:center; gap:10px; width:100%;
    background:transparent; border:none; cursor:pointer;
    padding:11px 14px; border-radius:5px;
    font-family:'Inter',sans-serif; font-size:13px;
    color:var(--ink); text-align:left;
    min-height:42px;
  }
  .card-menu button:hover { background:rgba(193,154,62,0.10); }
  .card-menu button.danger { color:var(--terracotta); }
  .card-menu button .ico { font-size:14px; opacity:0.8; }

  /* ─── Empty state ─── */
  .empty {
    text-align:center;
    padding:80px 24px;
    background:var(--paper-soft);
    border:1px dashed var(--rule);
    border-radius:12px;
  }
  .empty .glyph {
    font-family:'Fraunces',serif; font-style:italic; font-weight:400;
    font-size:72px; color:var(--pompeii-red); line-height:1;
    opacity:0.55;
    margin-bottom:18px;
  }
  .empty h3 {
    font-family:'Fraunces',serif; font-style:italic; font-weight:500;
    font-size:30px; color:var(--ink); margin-bottom:10px;
    letter-spacing:-0.012em;
  }
  .empty h3 em { color:var(--ochre); }
  .empty p {
    font-family:'Newsreader',serif; font-style:italic;
    font-size:16px; color:var(--mute-1); line-height:1.55;
    max-width:480px; margin:0 auto 26px;
  }
  .empty a {
    display:inline-block; padding:14px 22px;
    background:var(--ink); color:var(--paper);
    text-decoration:none; border-radius:99px;
    font-family:'Geist Mono',monospace; font-weight:600;
    font-size:10.5px; letter-spacing:0.22em; text-transform:uppercase;
    min-height:48px;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  .empty a:hover { background:var(--ochre); color:var(--ink); }

  /* ─── Anonymous gate ─── */
  .anon {
    text-align:center;
    padding:64px 24px;
    background:var(--paper-soft);
    border:1px solid var(--rule);
    border-radius:12px;
  }
  .anon h3 {
    font-family:'Fraunces',serif; font-style:italic; font-weight:500;
    font-size:28px; color:var(--ink); margin-bottom:14px;
    letter-spacing:-0.012em;
  }
  .anon h3 em { color:var(--ochre); }
  .anon p {
    font-family:'Newsreader',serif; font-style:italic;
    font-size:15px; color:var(--mute-1); line-height:1.55;
    max-width:440px; margin:0 auto 22px;
  }
  .anon button {
    padding:14px 22px; background:var(--ink); color:var(--paper);
    border:none; border-radius:99px; cursor:pointer;
    font-family:'Geist Mono',monospace; font-weight:600;
    font-size:11px; letter-spacing:0.22em; text-transform:uppercase;
    min-height:48px;
  }

  /* ─── Toast (for undo on delete) ─── */
  .undo-toast {
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
    transform:translateX(-50%) translateY(20px); opacity:0; pointer-events:none;
    display:inline-flex; align-items:center; gap:14px;
    padding:12px 18px;
    background:var(--ink); color:var(--paper);
    border-radius:99px;
    font-family:'Geist Mono',monospace; font-weight:600;
    font-size:10.5px; letter-spacing:0.20em; text-transform:uppercase;
    box-shadow:0 12px 30px -8px rgba(0,0,0,0.55);
    transition:transform .35s cubic-bezier(.32,.72,0,1), opacity .35s ease;
    z-index:100;
  }
  .undo-toast[data-show="true"] { opacity:1; transform:translateX(-50%) translateY(0); }
  .undo-toast button {
    background:var(--ochre); color:var(--ink); border:none;
    padding:6px 12px; border-radius:99px; cursor:pointer;
    font-family:inherit; font-weight:600; font-size:10px; letter-spacing:0.20em;
  }
  @media (max-width:640px) {
    .undo-toast {
      left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
      transform:translateY(20px); width:auto; max-width:none;
      justify-content:space-between;
    }
    .undo-toast[data-show="true"] { transform:translateY(0); }
  }

  /* ─── Brand footer (quiet origin whisper) ─── */
  .pompeii-footer {
    margin-top:80px; padding:32px 0 12px;
    border-top:1px solid var(--hairline);
    text-align:center;
  }
  .pompeii-footer p {
    font-family:'Newsreader',Georgia,serif; font-style:italic;
    font-size:14px; line-height:1.6;
    color:var(--mute-2);
    max-width:560px; margin:0 auto;
  }
  .pompeii-footer em {
    font-family:'Fraunces',Georgia,serif; font-style:italic; font-weight:500;
    color:var(--pompeii-red); letter-spacing:-0.005em; font-size:15px;
  }
  /* Tiny Roman SPQR-style mark above the footer — almost invisible until you look */
  .pompeii-footer::before {
    content:'·  ·  ·';
    display:block; margin:0 auto 18px;
    font-family:'Fraunces',Georgia,serif;
    font-size:18px; letter-spacing:0.4em;
    color:var(--pompeii-red); opacity:0.45;
  }

  /* ─── Mobile pass ─── */
  @media (max-width:640px) {
    .id-block { gap:14px; }
    .id-block h1 { font-size:32px; }
    .id-block .actions { width:100%; justify-content:flex-end; }
    .filters { gap:6px; }
    .filters button { padding:8px 14px; font-size:9.5px; }
    .margin-card { padding:20px 20px 16px; }
    .margin-card .quote { font-size:18px; }
    .margin-card .take { font-size:14.5px; }
    .pompeii-footer { margin-top:56px; padding:24px 0 8px; }
    .pompeii-footer p { font-size:13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .margin-card, .undo-toast { transition:none; }
    .margin-card.just-added { animation:none; }
  }
</style>

<script>
(function () {
  "use strict";

  const SUPABASE_URL = (window.LOOMUS_AUTH_CONFIG || {}).supabaseUrl || "";
  const EDGE_FN_MODIFY = SUPABASE_URL.replace(/\/$/, "") + "/functions/v1/library-modify";

  const mount = document.getElementById("wall-mount");
  const undoToastEl = document.getElementById("undo-toast");
  let allRows = [];
  let activeFilter = "all"; // all | public | private | book
  let undoTimer = null;
  let pendingUndo = null;

  // ─── Helpers ────────────────────────────────────────────────────
  function escapeHtml(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function toRoman(n) {
    // Renders 1–3999 as Roman numerals. Above 3999 falls back to arabic.
    if (!Number.isFinite(n) || n < 1 || n >= 4000) return String(n);
    const map = [
      [1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],
      [100, "C"],[90, "XC"],[50, "L"],[40, "XL"],
      [10,  "X"],[9,  "IX"],[5,  "V"],[4,  "IV"],[1, "I"],
    ];
    let out = "", left = Math.floor(n);
    for (const [v, sym] of map) { while (left >= v) { out += sym; left -= v; } }
    return out;
  }
  function relativeTime(iso) {
    const d = new Date(iso); const now = Date.now();
    const diff = (now - d.getTime()) / 1000;
    if (diff < 60) return "just now";
    if (diff < 3600) return Math.floor(diff/60) + " min ago";
    if (diff < 86400) return Math.floor(diff/3600) + " hr ago";
    if (diff < 86400*7) return Math.floor(diff/86400) + " days ago";
    return d.toLocaleDateString("en-US", { month:"short", day:"numeric" }).toUpperCase();
  }
  function daysAgo(iso) {
    const d = new Date(iso);
    return Math.max(1, Math.floor((Date.now() - d.getTime()) / 86400000));
  }
  function unique(arr, keyFn) {
    const s = new Set(); const out = [];
    arr.forEach(x => { const k = keyFn(x); if (!s.has(k)) { s.add(k); out.push(x); } });
    return out;
  }
  async function accessToken() {
    const La = window.LoomusAuth;
    if (!La) return null;
    if (typeof La.getAccessToken === "function") {
      const t = await La.getAccessToken();
      return (typeof t === "string" ? t : t?.access_token) || null;
    }
    if (La.client && La.client.auth) {
      const { data } = await La.client.auth.getSession();
      return data?.session?.access_token || null;
    }
    return null;
  }

  // ─── Render ─────────────────────────────────────────────────────
  function renderAnon(userEmail) {
    mount.innerHTML = `
      <div class="anon">
        <h3>Your <em>Pompeii</em> is waiting for you.</h3>
        <p>Sign in to see the margins you'll write — the line that hit you,
           your reaction, every quote you'll stop on. They land here, on
           your wall.</p>
        <button type="button" onclick="window.LoomusAuth && window.LoomusAuth.signIn && window.LoomusAuth.signIn()">Sign in to see yours</button>
      </div>`;
    showFooter();
  }

  function renderEmpty(displayName) {
    mount.innerHTML = `
      <div class="id-block">
        <div>
          <h1>${escapeHtml(displayName)}'s <em>Pompeii</em></h1>
          <p class="sub">your first margin will live here · welcome</p>
        </div>
      </div>
      <div class="empty">
        <p class="glyph">&ldquo;</p>
        <h3>An <em>empty wall</em> · for now.</h3>
        <p>Open any graph, click a node, and you'll see a margin form —
           one line that hit you, one line of your own. Pin it. It lives
           here, the way graffiti lived on the actual walls of Pompeii.</p>
        <a href="https://graphs.loomus.ai/thousand-brains-hawkins">Open a graph →</a>
      </div>`;
    showFooter();
  }

  function renderWall(rows, displayName, justAddedId) {
    const margins = rows.filter(r => r.kind === "note");
    const filtered = (() => {
      if (activeFilter === "public")  return margins.filter(r => r.visibility === "public");
      if (activeFilter === "private") return margins.filter(r => r.visibility === "private");
      return margins;
    })();
    const distinctBooks = unique(
      margins.map(r => (r.target_ref || r.ref || "").split(":")[0]).filter(Boolean),
      x => x
    );
    const publicCount = margins.filter(r => r.visibility === "public").length;
    const startedDays = margins.length
      ? daysAgo(margins[margins.length - 1].saved_at)
      : 0;

    const subParts = [
      `across <em>${distinctBooks.length}</em> book${distinctBooks.length === 1 ? "" : "s"}`,
      `<em>${publicCount}</em> in the public margin`,
      `started <em>${startedDays} day${startedDays === 1 ? "" : "s"} ago</em>`,
    ];

    mount.innerHTML = `
      <div class="id-block">
        <div>
          <h1>${escapeHtml(displayName)}'s <em>Pompeii</em> · ${margins.length} margin${margins.length === 1 ? "" : "s"}<span class="roman" title="In the old count">${toRoman(margins.length)}</span></h1>
          <p class="sub">${subParts.join(" &nbsp;·&nbsp; ")}</p>
        </div>
        <div class="actions">
          <button type="button" class="share-wall-btn" data-share-wall>
            <span aria-hidden="true">⤴</span><span>Share my Pompeii</span>
          </button>
        </div>
      </div>

      <div class="filters" role="group" aria-label="Filter margins">
        <button type="button" data-filter="all"    class="${activeFilter==='all'?'active':''}">All · ${margins.length}</button>
        <button type="button" data-filter="public" class="${activeFilter==='public'?'active':''}">🌿 Public · ${publicCount}</button>
        <button type="button" data-filter="private" class="${activeFilter==='private'?'active':''}">🔒 Private · ${margins.length - publicCount}</button>
      </div>

      ${filtered.length === 0 ? `
        <div class="empty" style="padding:48px 24px;">
          <h3>No margins with this filter.</h3>
          <p style="margin-bottom:0;">Try a different one above.</p>
        </div>
      ` : `
        <div class="grid">
          ${filtered.map(r => renderCard(r, r.id === justAddedId)).join("")}
        </div>
      `}
    `;
    wireWallEvents();
  }

  function renderCard(r, justAdded) {
    const slug = (r.target_ref || r.ref || "").split(":")[0];
    const bookLabel = r.display_source || (slug ? `from <em>${escapeHtml(slug.replace(/-/g, " "))}</em>` : "—");
    const visLabel  = r.visibility === "public" ? "🌿 IN THE MARGIN" : "🔒 JUST FOR YOU";
    const visClass  = r.visibility === "public" ? "public" : "private";
    return `
      <article class="margin-card${justAdded ? ' just-added' : ''}" data-id="${escapeHtml(r.id)}" data-vis="${escapeHtml(r.visibility)}">
        <button type="button" class="card-menu-btn" aria-label="Margin actions" data-menu-toggle>⋯</button>
        <div class="card-menu" data-card-menu>
          <button type="button" data-action="edit"><span class="ico">✎</span><span>Edit reaction</span></button>
          <button type="button" data-action="toggle-vis">
            <span class="ico">${r.visibility==='public'?'🔒':'🌿'}</span>
            <span>${r.visibility==='public'?'Make private':'Join the public margin'}</span>
          </button>
          ${slug ? `<button type="button" data-action="visit"><span class="ico">↗</span><span>Open the source</span></button>` : ''}
          <button type="button" class="danger" data-action="delete"><span class="ico">🗑</span><span>Remove</span></button>
        </div>
        <div class="source">
          <span class="book">FROM &nbsp; ${bookLabel}</span>
          <span class="vis ${visClass}">${visLabel}</span>
        </div>
        <p class="quote">${escapeHtml(r.display_title || r.note || "—")}</p>
        ${r.note && r.display_title ? `<p class="take">${escapeHtml(r.note)}</p>` : ''}
        <div class="meta">
          <span>${escapeHtml(relativeTime(r.saved_at))}</span>
        </div>
      </article>`;
  }

  // ─── Wire events ────────────────────────────────────────────────
  function wireWallEvents() {
    // filter buttons
    mount.querySelectorAll(".filters button").forEach(b => {
      b.addEventListener("click", () => {
        activeFilter = b.getAttribute("data-filter");
        renderWall(allRows, currentDisplayName, justAddedFromUrl());
      });
    });
    // share wall
    const shareBtn = mount.querySelector("[data-share-wall]");
    if (shareBtn) shareBtn.addEventListener("click", onShareWall);

    // card menus
    mount.querySelectorAll(".margin-card").forEach(card => {
      const toggle = card.querySelector("[data-menu-toggle]");
      const menu   = card.querySelector("[data-card-menu]");
      toggle.addEventListener("click", (e) => {
        e.stopPropagation();
        // close any other open menus first
        mount.querySelectorAll("[data-card-menu]").forEach(m => { if (m !== menu) m.dataset.open = "false"; });
        menu.dataset.open = menu.dataset.open === "true" ? "false" : "true";
      });
      menu.querySelectorAll("button[data-action]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          menu.dataset.open = "false";
          const action = btn.getAttribute("data-action");
          const id = card.getAttribute("data-id");
          if (action === "delete")     onDelete(id, card);
          if (action === "toggle-vis") onToggleVis(id, card);
          if (action === "edit")       onEdit(id, card);
          if (action === "visit")      onVisit(id, card);
        });
      });
    });
    // click outside closes all menus
    document.addEventListener("click", () => {
      mount.querySelectorAll("[data-card-menu]").forEach(m => m.dataset.open = "false");
    });
  }

  // ─── Actions ────────────────────────────────────────────────────
  async function callModify(op, body) {
    const token = await accessToken();
    if (!token) throw new Error("not_signed_in");
    const r = await fetch(EDGE_FN_MODIFY, {
      method:"POST",
      headers:{ "Authorization":`Bearer ${token}`, "Content-Type":"application/json" },
      body: JSON.stringify({ op, ...body }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) throw new Error(d.error || "modify_failed");
    return d;
  }

  async function onDelete(id, card) {
    // optimistic remove + undo toast
    card.style.transition = "opacity .25s ease, transform .25s ease";
    card.style.opacity = "0"; card.style.transform = "scale(0.96)";
    setTimeout(() => { card.remove(); }, 260);
    pendingUndo = { id };
    try {
      await callModify("delete", { id });
      showUndoToast("Margin removed");
    } catch (err) {
      console.error(err);
      // restore on failure
      pendingUndo = null;
      refresh();
    }
  }

  async function onToggleVis(id) {
    const row = allRows.find(r => r.id === id);
    if (!row) return;
    const next = row.visibility === "public" ? "private" : "public";
    try {
      await callModify("update", { id, fields: { visibility: next } });
      row.visibility = next;
      renderWall(allRows, currentDisplayName, justAddedFromUrl());
    } catch (err) { console.error(err); }
  }

  function onEdit(id, card) {
    const row = allRows.find(r => r.id === id);
    if (!row) return;
    const newTake = window.prompt("Edit your reaction (280 chars max):", row.note || "");
    if (newTake == null) return;
    if (newTake.length > 280) return alert("Keep it under 280 characters.");
    callModify("update", { id, fields: { note: newTake } })
      .then(() => { row.note = newTake; renderWall(allRows, currentDisplayName, justAddedFromUrl()); })
      .catch(err => console.error(err));
  }

  function onVisit(id) {
    const row = allRows.find(r => r.id === id);
    if (!row) return;
    const slug = (row.target_ref || row.ref || "").split(":")[0];
    if (slug) window.open(`https://graphs.loomus.ai/${slug}`, "_blank");
  }

  // ─── Undo toast ─────────────────────────────────────────────────
  function showUndoToast(msg) {
    clearTimeout(undoTimer);
    undoToastEl.querySelector("[data-undo-msg]").textContent = msg;
    undoToastEl.dataset.show = "true";
    undoTimer = setTimeout(() => { undoToastEl.dataset.show = "false"; pendingUndo = null; }, 5000);
  }
  document.getElementById("undo-toast").querySelector("[data-undo-btn]").addEventListener("click", async () => {
    if (!pendingUndo) return;
    try {
      await callModify("undelete", { id: pendingUndo.id });
      undoToastEl.dataset.show = "false";
      pendingUndo = null;
      refresh();
    } catch (err) { console.error(err); }
  });

  // ─── Share-my-wall (PNG) — uses html-to-image-style approach ───
  async function onShareWall() {
    // For v1, we generate a simple data URL of an SVG, prompt download.
    // For v2, we'll inline html-to-image lib (same pipeline as graph share PNGs).
    const pubs = allRows.filter(r => r.kind === "note" && r.visibility === "public").slice(0, 3);
    if (pubs.length === 0) { alert("Pin at least one public margin first."); return; }
    // For now just copy a link the user can paste.
    const url = location.origin + "/you/wall";
    try {
      await navigator.clipboard.writeText(url);
      showUndoToast("Link copied — paste into IG / X / WeChat");
    } catch {
      showUndoToast("Share coming soon — for now, screenshot this page");
    }
  }

  // ─── Boot ───────────────────────────────────────────────────────
  let currentDisplayName = "Your";

  function showFooter() {
    const f = document.getElementById("pompeii-footer");
    if (f) f.hidden = false;
  }
  function justAddedFromUrl() {
    try { return new URLSearchParams(location.search).get("just_added") || null; } catch { return null; }
  }
  async function fetchRows() {
    const La = window.LoomusAuth;
    const sb = La && La.client ? La.client : (window.supabase || null);
    if (!sb) throw new Error("no supabase client");
    const { data, error } = await sb
      .from("library_items")
      .select("id, kind, ref, target_ref, display_title, display_source, source_url, note, visibility, saved_at")
      .is("removed_at", null)
      .order("saved_at", { ascending: false });
    if (error) throw error;
    return data || [];
  }
  async function refresh() {
    try {
      allRows = await fetchRows();
      const margins = allRows.filter(r => r.kind === "note");
      if (margins.length === 0) {
        renderEmpty(currentDisplayName);
      } else {
        renderWall(allRows, currentDisplayName, justAddedFromUrl());
      }
      showFooter();
    } catch (err) {
      console.error("[pompeii] fetch failed", err);
      renderEmpty(currentDisplayName);
    }
  }

  function deriveDisplayName(user) {
    if (!user) return "Your";
    const email = user.email || "";
    const handle = email.split("@")[0].split(/[._-]/)[0];
    if (!handle) return "Your";
    return handle.charAt(0).toUpperCase() + handle.slice(1) + "'s";
  }

  // ─── Demo rows · used as fallback when LoomusAuth doesn't load
  //     (e.g. local file:// preview, ad-block stripping loomus-auth.js,
  //     or — pre-launch — before the sign-in flow is wired). Keeps the
  //     page from ever looking "dead". ─────────────────────────────
  const DEMO_ROWS = [
    { id:"d-1", kind:"note", ref:"secret-of-our-success:henrich-cultural-brain", target_ref:"secret-of-our-success",
      display_title:"Culture is the secret of our success — not individual intelligence.",
      display_source:"from The Secret of Our Success · Henrich",
      note:"This is why LLMs need internet-scale corpora to emerge intelligence — culture is the curriculum. Bigger compute won't beat better data.",
      visibility:"public", saved_at:new Date(Date.now()-1*86400e3).toISOString() },
    { id:"d-2", kind:"note", ref:"brief-history-intelligence:first-brains", target_ref:"brief-history-intelligence",
      display_title:"The first brains weren't built for thinking — they were built for moving toward and away.",
      display_source:"from A Brief History of Intelligence · Bennett",
      note:"Cortex came late, optional. Most of the mind is a steering wheel. Every 'alignment' debate is really a steering-wheel debate, dressed up.",
      visibility:"public", saved_at:new Date(Date.now()-3*86400e3).toISOString() },
    { id:"d-3", kind:"note", ref:"models-of-mind:predict", target_ref:"models-of-mind",
      display_title:"The brain doesn't represent the world — it predicts it.",
      display_source:"from Models of the Mind · Lindsay",
      note:"If I really believed this I would build a different distill engine. Predict-then-correct, not extract-then-summarize. Worth a Sunday.",
      visibility:"private", saved_at:new Date(Date.now()-7*86400e3).toISOString() },
    { id:"d-4", kind:"note", ref:"coming-wave:containment", target_ref:"coming-wave",
      display_title:"Containment is not solved by walls; it's solved by purpose.",
      display_source:"from The Coming Wave · Suleyman",
      note:"Reread three times. The framing flip from 'can we stop AI' to 'what is AI for' is the actual move.",
      visibility:"public", saved_at:new Date(Date.now()-9*86400e3).toISOString() },
    { id:"d-5", kind:"note", ref:"being-you:best-guess", target_ref:"being-you",
      display_title:"Consciousness is the brain's best guess at being a self.",
      display_source:"from Being You · Seth",
      note:"'Best guess at' not 'knowledge of.' If consciousness is the act of guessing, then AI consciousness is a question about its uncertainty, not its compute.",
      visibility:"public", saved_at:new Date(Date.now()-12*86400e3).toISOString() },
    { id:"d-6", kind:"note", ref:"aggregators:thompson", target_ref:"aggregators",
      display_title:"Aggregators win by owning users, not supply.",
      display_source:"from Defining Aggregators · Thompson",
      note:"LOOMUS is on the user side. Marginalia is the relationship. Distill is the service. Foundation is the trust. Three different 'owns' — all the same user.",
      visibility:"private", saved_at:new Date(Date.now()-14*86400e3).toISOString() },
  ];

  function bootDemo(reason) {
    console.info("[pompeii] booting demo mode:", reason);
    currentDisplayName = "Sophie";
    allRows = DEMO_ROWS;
    renderWall(allRows, currentDisplayName, null);
    showFooter();
  }

  function boot() {
    let settled = false;

    // Fallback: if LoomusAuth doesn't show up in 1.5 s, render a demo
    // Pompeii so the design can be reviewed (file:// preview / pre-launch /
    // ad-blocked loomus-auth.js). The live page replaces it the moment
    // LoomusAuth answers.
    const fallbackT = setTimeout(() => {
      if (settled) return;
      settled = true;
      bootDemo(location.protocol === "file:" ? "file://" : "LoomusAuth never loaded");
    }, 1500);

    const tryWire = () => {
      const La = window.LoomusAuth;
      if (!La || typeof La.onAuthChange !== "function") return false;
      settled = true; clearTimeout(fallbackT);
      La.onAuthChange(async (event) => {
        const user = (typeof La.getUser === "function") ? La.getUser() : null;
        if (event === "SIGNED_OUT" || !user) { renderAnon(); return; }
        currentDisplayName = deriveDisplayName(user).replace(/'s$/, "");
        await refresh();
      });
      return true;
    };

    if (tryWire()) return;
    // poll briefly in case loomus-auth.js is still loading
    let tries = 0;
    const poll = setInterval(() => {
      if (settled) { clearInterval(poll); return; }
      if (tryWire() || ++tries > 12) clearInterval(poll);
    }, 100);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else { boot(); }
})();
</script>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>No worries · LOOMUS Foundation</title>

<script>window.LOOMUS_AUTH_CONFIG = {

  supabaseAnonKey: "sb_publishable_Bc5UTKf0onjSH9wGmgAh7w_UHQArMK-"
};</script>
<script src="https://loomus.ai/loomus-auth.js"></script>

<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">

<style>
:root {
  --paper:#f5efe4; --paper-soft:#ebe1ce; --ink:#1f1d18; --ink-soft:#4a463d; --ink-muted:#8b8474;
  --forest:#2d4a3e; --ochre:#c19a3e; --ochre-bright:#d4ac4a; --terracotta:#c66b3d;
  --rule:#d4caba;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body{display:flex;flex-direction:column}

.chrome{
  padding:16px 56px;display:flex;align-items:center;gap:18px;
  padding-top:calc(16px + env(safe-area-inset-top, 0));
  border-bottom:1px solid var(--rule);
  font:600 11.5px 'Geist Mono',monospace;letter-spacing:0.28em;
  color:var(--ink-muted);text-transform:uppercase;background:var(--paper);
}
.chrome-home{text-decoration:none;color:inherit;display:flex;align-items:center;transition:opacity 0.2s ease}
.chrome-home:hover{opacity:0.72}
.chrome-logo{height:28px;width:auto;display:block}
.chrome .sep{width:4px;height:4px;background:var(--ochre);border-radius:50%;flex-shrink:0}
.chrome .spacer{margin-left:auto}
.account-chip{
  background:transparent;border:1px solid var(--rule);border-radius:99px;
  padding:6px 12px;display:none;align-items:center;gap:7px;
  font:500 10px/1 'Geist Mono',monospace;letter-spacing:0.05em;
  color:var(--ink-soft);text-transform:none;max-width:200px;
}
.account-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--forest);flex-shrink:0}
.account-chip .em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-chip.visible{display:inline-flex}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 28px 72px;text-align:center}
.shell{max-width:560px;width:100%}

.eyebrow{
  font:500 11px 'Geist Mono',monospace;letter-spacing:0.28em;
  color:var(--ink-muted);text-transform:uppercase;margin-bottom:18px;
}
h1{
  font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:56px;line-height:1.05;
  letter-spacing:-0.018em;margin-bottom:18px;color:var(--ink);
}
.warm{
  font-family:'Fraunces',serif;font-weight:400;font-size:18px;line-height:1.55;
  color:var(--ink-soft);max-width:440px;margin:0 auto 40px;
}

.ctas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.cta{
  display:inline-block;padding:13px 22px;border-radius:99px;text-decoration:none;
  font:500 12px 'Geist Mono',monospace;letter-spacing:0.16em;text-transform:uppercase;
  transition:background .22s ease, color .22s ease, transform .22s ease, border-color .22s ease;
}
.cta-primary{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
.cta-primary:hover{background:var(--forest);border-color:var(--forest);transform:translateY(-1px)}
.cta-secondary{background:transparent;color:var(--ink-soft);border:1px solid var(--rule)}
.cta-secondary:hover{color:var(--ochre);border-color:var(--ochre);transform:translateY(-1px)}

@media (max-width:640px){
  .chrome{padding:11px 18px;padding-top:calc(11px + env(safe-area-inset-top, 0));gap:9px;font-size:10px;letter-spacing:0.22em}
  .chrome-logo{height:20px}
  main{padding:36px 22px 56px}
  h1{font-size:44px}
  .warm{font-size:16px}
  .cta{padding:12px 18px;font-size:11px}
}
</style>
</head>
<body>

<nav class="chrome" aria-label="LOOMUS chrome">
  <a href="/" class="chrome-home" aria-label="Back to LOOMUS"><img src="/loomus-logo.png" alt="LOOMUS" class="chrome-logo"></a>
  <span class="sep"></span>
  <span>Foundation</span>
  <span class="sep"></span>
  <span>Cancel</span>
  <span class="spacer"></span>
  <span class="account-chip" id="account-chip"><span class="dot"></span><span class="em" id="account-email">—</span></span>
</nav>

<main>
  <div class="shell">
    <div class="eyebrow">Checkout cancelled · no charge made</div>
    <h1>No worries.</h1>
    <p class="warm">
      Reading is free. The patron tier just lets us keep building tools you'd actually use.
    </p>
    <div class="ctas">
      <a class="cta cta-secondary" href="https://marginalia.loomus.ai">← Back to Marginalia</a>
      <a class="cta cta-primary" href="/foundation">See what each tier unlocks →</a>
    </div>
  </div>
</main>

<script>
(function(){
  function paintAccount() {
    var u = window.LoomusAuth && window.LoomusAuth.getUser && window.LoomusAuth.getUser();
    var chip = document.getElementById("account-chip");
    var em   = document.getElementById("account-email");
    if (u && u.email) {
      em.textContent = u.email;
      chip.classList.add("visible");
    } else {
      chip.classList.remove("visible");
    }
  }
  paintAccount();
  if (window.LoomusAuth && window.LoomusAuth.onAuthChange) {
    window.LoomusAuth.onAuthChange(function(){ paintAccount(); });
  }
})();
</script>

</body>
</html>
